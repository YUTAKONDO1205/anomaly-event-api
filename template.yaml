AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Anomaly Event API

Parameters:
  RekognitionProjectVersionArn:
    Type: String
    Default: ""
  DetectionTargetLabel:
    Type: String
    Default: Positive
  DetectionMinConfidence:
    Type: Number
    Default: 80

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        EVENT_IMAGES_BUCKET: !Ref EventImagesBucket
        REKOGNITION_PROJECT_VERSION_ARN: !Ref RekognitionProjectVersionArn
        DETECTION_TARGET_LABEL: !Ref DetectionTargetLabel
        DETECTION_MIN_CONFIDENCE: !Ref DetectionMinConfidence

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS

  CreateEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/createEvent.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        CreateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events
            Method: POST

  GetEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/getEvents.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        GetEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events
            Method: GET

  GetEventByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/getEventById.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        GetEventById:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events/{id}
            Method: GET

  UpdateEventStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/updateEventStatus.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        UpdateEventStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events/{id}/status
            Method: PATCH

  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/getUploadUrl.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref EventImagesBucket
      Events:
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /upload-url
            Method: POST

  DetectImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/detectImage.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - S3ReadPolicy:
            BucketName: !Ref EventImagesBucket
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectCustomLabels
              Resource: "*"
      Events:
        DetectImage:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /detect
            Method: POST

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AnomalyEvents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  EventImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub anomaly-event-images-${AWS::AccountId}-${AWS::Region}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - "*"
            MaxAge: 300

Outputs:
  ApiUrl:
    Description: HTTP API endpoint
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
