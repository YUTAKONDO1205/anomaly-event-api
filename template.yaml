AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Anomaly Event API

Parameters:
  DetectionProvider:
    Type: String
    Default: aws-deep-learning
    AllowedValues:
      - aws-deep-learning
      - rekognition
      - heuristic
  RekognitionProjectVersionArn:
    Type: String
    Default: ""
  DetectionTargetLabel:
    Type: String
    Default: Positive
  DetectionMinConfidence:
    Type: Number
    Default: 80

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        APP_STORAGE_MODE: aws
        DETECTION_PROVIDER: !Ref DetectionProvider
        EVENTS_TABLE: !Ref EventsTable
        EVENT_IMAGES_BUCKET: !Ref EventImagesBucket
        AWS_DEEP_LEARNING_FUNCTION_NAME: !Ref DeepLearningInferenceFunction
        PYTHON_MODEL_PATH: aws/deep-learning-artifacts/model/crack-local-model.json
        REKOGNITION_PROJECT_VERSION_ARN: !Ref RekognitionProjectVersionArn
        DETECTION_TARGET_LABEL: !Ref DetectionTargetLabel
        DETECTION_MIN_CONFIDENCE: !Ref DetectionMinConfidence

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS

  CreateEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: .
      Handler: dist/handlers/createEvent.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        CreateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events
            Method: POST

  GetEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: .
      Handler: dist/handlers/getEvents.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        GetEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events
            Method: GET

  GetDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: .
      Handler: dist/handlers/getDashboard.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        GetDashboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /dashboard
            Method: GET

  GetEventByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: .
      Handler: dist/handlers/getEventById.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        GetEventById:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events/{id}
            Method: GET

  UpdateEventStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: .
      Handler: dist/handlers/updateEventStatus.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        UpdateEventStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events/{id}/status
            Method: PATCH

  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: .
      Handler: dist/handlers/getUploadUrl.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref EventImagesBucket
      Events:
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /upload-url
            Method: POST

  DetectImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: .
      Handler: dist/handlers/detectImage.handler
      Timeout: 30
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - S3ReadPolicy:
            BucketName: !Ref EventImagesBucket
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectCustomLabels
              Resource: "*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt DeepLearningInferenceFunction.Arn
      Events:
        DetectImage:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /detect
            Method: POST

  DeepLearningInferenceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: aws/deep-learning-lambda/Dockerfile
    Properties:
      PackageType: Image
      Timeout: 60
      MemorySize: 4096
      Architectures:
        - x86_64
      Environment:
        Variables:
          MODEL_ARTIFACT_PATH: /var/task/model/crack-local-model.json
          MODEL_WEIGHTS_PATH: /var/task/model/crack-local-model.pt

  GetUploadedImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: .
      Handler: dist/handlers/getUploadedImage.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref EventImagesBucket
      Events:
        GetUploadedImage:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /uploads/{imageKey+}
            Method: GET

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AnomalyEvents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  EventImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub anomaly-event-images-${AWS::AccountId}-${AWS::Region}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - "*"
            MaxAge: 300

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub anomaly-event-frontend-${AWS::AccountId}-${AWS::Region}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForFrontendSite
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

Outputs:
  ApiUrl:
    Description: HTTP API endpoint
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  DeepLearningFunctionName:
    Description: Lambda name for AWS deep-learning inference
    Value: !Ref DeepLearningInferenceFunction
  FrontendBucketName:
    Description: S3 bucket for the static web frontend
    Value: !Ref FrontendBucket
  FrontendWebsiteUrl:
    Description: Public website URL for the static frontend
    Value: !GetAtt FrontendBucket.WebsiteURL
